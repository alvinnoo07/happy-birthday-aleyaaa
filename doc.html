<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For You ❤️</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =================================
         AUDIO / LAGU
    ================================== -->

    <audio id="music" loop>

        <source
            src="music/raindance.mp3"
            type="audio/mpeg">

    </audio>



    <!-- =================================
         MUSIC PLAYER
    ================================== -->

    <div
        class="music-player"
        id="musicPlayer">


        <!-- COVER -->

        <div class="music-cover">

            💿

        </div>



        <!-- INFO LAGU -->

        <div class="music-info">

            <div class="music-title">

                Raindance

            </div>


            <div class="music-artist">

                Dave & Tems

            </div>

        </div>



        <!-- ANIMASI BAR MUSIK -->

        <div class="music-bars">

            <span></span>

            <span></span>

            <span></span>

            <span></span>

            <span></span>

        </div>


    </div>



    <!-- =================================
         HALAMAN AMPLOP
    ================================== -->

    <section
        class="screen envelope-screen"
        id="envelopeScreen">


        <!-- AMPLOP -->

        <div
            class="envelope"
            id="envelope">


            <!-- BAGIAN ATAS AMPLOP -->

            <div class="envelope-top"></div>



            <!-- BADAN AMPLOP -->

            <div class="envelope-body">


                <!-- KERTAS DI DALAM -->

                <div class="paper">

                    💌

                </div>


            </div>


        </div>



        <!-- TEXT -->

        <p class="hint">

            Klik amplopnya...

        </p>


    </section>



    <!-- =================================
         HALAMAN SURAT
    ================================== -->

    <section
        class="screen letter-screen"
        id="letterScreen">


        <div class="letter">


            <h1>

                Untuk Kamu ❤️

            </h1>



            <p>

                Hai kamu...

                <br><br>

                Ada sesuatu yang pengen aku
                sampaikan.

                <br><br>

                Jadi sebelum kamu lanjut,
                baca surat ini sampai selesai ya.

                <br><br>

                Terima kasih sudah menjadi
                seseorang yang sangat berarti
                buat aku.

            </p>



            <!-- TOMBOL SELESAI -->

            <button id="finishBtn">

                Selesai ❤️

            </button>


        </div>


    </section>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>


</body>

</html>
